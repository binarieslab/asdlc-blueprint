name: CI

on:
  pull_request:
    branches: [main, 'release/**']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up the toolchain (Flutter here; docs/architecture/github-workflows.md lists the others)
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.35.3'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Feature map check, comment ban, analyzer and formatting
        run: make lint

  build_and_test:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up the toolchain (Flutter here; docs/architecture/github-workflows.md lists the others)
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.35.3'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Feature map check, tests and the lint tool's own tests
        run: make test
