name: check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  template:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: The example feature map is consistent
        run: python3 template/feature-map/scripts/check.py

      - name: The tools' own tests pass
        run: python3 -m unittest discover -s template/tool/tests

      - name: The scorecard template is one the scorecard check can read
        run: python3 template/tool/asdlc_verify.py --scorecard skills/asdlc-adopt/templates/scorecard.md --checks template/tool/asdlc_checks.json

      - name: make asdlc-verify works in a repository made from the template
        run: |
          mkdir -p "$RUNNER_TEMP/adopted/docs/asdlc"
          cp -R template/. "$RUNNER_TEMP/adopted/"
          cp skills/asdlc-adopt/templates/scorecard.md "$RUNNER_TEMP/adopted/docs/asdlc/"
          make -C "$RUNNER_TEMP/adopted" asdlc-verify

      - name: The template's own code has no comments
        run: python3 template/tool/comment_ban.py --approved template/tool/approved_comments.txt template
